name: Publish to NuGet

# Release pipeline using NuGet Trusted Publishing (OIDC) — no long-lived API key
# is stored. Runs only when a version tag (v*) is pushed; the published version
# is taken from <Version> in NewType.Generator/NewType.Generator.csproj.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # required to create the GitHub Release for the tag
  id-token: write # required to request the GitHub OIDC token for Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      # Gate the release on the test suite. Run in Debug: constraint-validation
      # checks are emitted under `#if DEBUG`, so the `*_Throws` tests only exercise
      # the generated guards in a Debug build (matches the CI workflow).
      - name: Test
        run: dotnet test -c Debug --no-restore --verbosity normal

      - name: Pack
        run: dotnet pack NewType.Generator/NewType.Generator.csproj -c Release --no-restore -o ${{ runner.temp }}/artifacts

      # List the packed artifacts and fail fast if the symbol package (.snupkg)
      # was not produced — symbols are required so consumers can debug into the
      # generator. `dotnet pack` emits it because the project sets IncludeSymbols
      # and SymbolPackageFormat=snupkg.
      - name: List package
        run: |
          ls -l ${{ runner.temp }}/artifacts
          test -n "$(ls ${{ runner.temp }}/artifacts/*.snupkg 2>/dev/null)" \
            || { echo "::error::No .snupkg symbol package was generated"; exit 1; }

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: |
            ${{ runner.temp }}/artifacts/*.nupkg
            ${{ runner.temp }}/artifacts/*.snupkg

      # Exchange the GitHub OIDC token for a short-lived NuGet API key via the
      # Trusted Publishing policy configured on nuget.org. `NUGET_USER` is a repo
      # secret holding the nuget.org account that owns the policy.
      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # Pushing the .nupkg also uploads the matching .snupkg from the same
      # directory to nuget.org's symbol server automatically (this is dotnet's
      # default unless --no-symbols is passed), so symbols ship with the release.
      - name: Push to NuGet
        run: >
          dotnet nuget push "${{ runner.temp }}/artifacts/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      # Create the GitHub Release for the tag once the package is published.
      # `--generate-notes` autogenerates release notes from commits/PRs since the
      # previous tag; the packed .nupkg and .snupkg are attached as release assets.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          "${{ runner.temp }}"/artifacts/*.nupkg
          "${{ runner.temp }}"/artifacts/*.snupkg
          --title "${{ github.ref_name }}"
          --generate-notes
          --verify-tag
